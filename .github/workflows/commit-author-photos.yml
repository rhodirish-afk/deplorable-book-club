name: Commit author photos
on:
  push:
    branches: [main]
    paths:
      - 'assets/authors/*.jpg.b64'
      - '.github/workflows/commit-author-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit-jpgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPGs and commit
        run: |
          set -euo pipefail
          for f in assets/authors/*.jpg.b64; do
            [ -f "$f" ] || continue
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "decoded $out ($(wc -c < "$out") bytes)"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/authors/*.jpg || true
          if git diff --staged --quiet; then
            echo "jpgs unchanged"
          else
            git commit -m "Add founder-provided author photos (Myers, Matchett)"
            git push
          fi
