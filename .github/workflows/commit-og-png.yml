name: Commit OG PNG
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commit-og-png.yml'
      - 'assets/og.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit-png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate assets/og.png and commit
        run: |
          set -euo pipefail
          pip install pillow
          python << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os
          W, H = 1200, 630
          img = Image.new('RGB', (W, H), '#0f0e0c')
          draw = ImageDraw.Draw(img)
          for r in range(480, 0, -3):
              t = r / 480.0
              intensity = (1 - t) * 0.28
              col = (int(15 + 196 * intensity), int(14 + 92 * intensity * 0.7), int(12 + 38 * intensity * 0.5))
              draw.ellipse([60 - r, -80 - r, 60 + r, -80 + r], fill=col)
          for r in range(360, 0, -3):
              t = r / 360.0
              intensity = (1 - t) * 0.18
              col = (int(15 + 232 * intensity), int(14 + 168 * intensity), int(12 + 124 * intensity * 0.6))
              draw.ellipse([1080 - r, 560 - r, 1080 + r, 560 + r], fill=col)
          draw.rectangle([72, 190, 108, 440], fill='#c45c26')
          # DejaVu is on Ubuntu runners
          font_lg = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf', 72)
          font_sm = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 28)
          font_xs = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 22)
          draw.text((150, 210), 'The Deplorable', fill='#e8e0d4', font=font_lg)
          draw.text((150, 295), 'Book Club', fill='#e8a87c', font=font_lg)
          draw.text((150, 400), 'Books the trade will not touch.', fill='#a39a8c', font=font_sm)
          draw.text((150, 530), 'deplorablebookclub.com', fill='#a39a8c', font=font_xs)
          os.makedirs('assets', exist_ok=True)
          img.save('assets/og.png', 'PNG', optimize=True)
          print('wrote', os.path.getsize('assets/og.png'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og.png
          if git diff --staged --quiet; then
            echo "og.png unchanged"
          else
            git commit -m "Add assets/og.png (1200x630 brand card)"
            git push
          fi
