name: Commit author photo SVGs
on:
  push:
    branches: [main]
    paths:
      - 'assets/authors/*.jpg.b64'
      - 'assets/authors/*.jpg.b64.part2'
      - 'assets/authors/*.jpg.b64.part3'
      - 'assets/authors/*.jpg.b64.part4'
      - 'scripts/build_author_svgs.py'
      - '.github/workflows/commit-author-photo-svgs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble part2, build SVGs, commit
        run: |
          set -euo pipefail
          pip install pillow
          python scripts/build_author_svgs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/authors/*.jpg.b64 assets/authors/*.svg || true
          if git diff --staged --quiet; then
            echo unchanged
          else
            git commit -m "Build author portrait SVGs from founder-provided photos"
            git push
          fi
