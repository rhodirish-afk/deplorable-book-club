name: Commit author photo SVGs
on:
  push:
    branches: [main]
    paths:
      - 'assets/authors/*.jpg.b64'
      - '.github/workflows/commit-author-photo-svgs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build SVGs from b64 JPEGs and commit
        run: |
          set -euo pipefail
          pip install pillow
          python <<'PY'
          import base64, pathlib, io
          from PIL import Image
          for stem in ('kevin-myers', 'william-matchett'):
              b64path = pathlib.Path(f'assets/authors/{stem}.jpg.b64')
              if not b64path.exists():
                  print('skip', b64path)
                  continue
              raw = base64.b64decode(b64path.read_text().strip())
              im = Image.open(io.BytesIO(raw)).convert('RGB')
              w, h = im.size
              b64 = base64.b64encode(raw).decode()
              svg = (
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  f'<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="{w}" height="{h}" viewBox="0 0 {w} {h}">\n'
                  f'  <image width="{w}" height="{h}" xlink:href="data:image/jpeg;base64,{b64}"/>\n'
                  '</svg>\n'
              )
              out = pathlib.Path(f'assets/authors/{stem}.svg')
              out.write_text(svg)
              print('wrote', out, out.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/authors/*.svg
          if git diff --staged --quiet; then
            echo unchanged
          else
            git commit -m "Build author portrait SVGs from founder-provided photos"
            git push
          fi
